<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, 'DejaVu Sans Mono', monospace" role="img" aria-label="bnpm - Better (p)npm. The same npm or pnpm, with an interactive layer on top.">
  <defs>
    <style>
      @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
      .cursor { animation: blink 1.1s steps(1) infinite }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none } }
    </style>
  </defs>
  <rect width="1000" height="270" rx="14" fill="#1c1e26"/>
  <rect x="0.5" y="0.5" width="999" height="269" rx="14" fill="none" stroke="#2e303e"/>

  <text x="375" y="140" font-size="92" font-weight="700" textLength="220.8" lengthAdjust="spacingAndGlyphs">
    <tspan fill="#e95678">b</tspan><tspan fill="#d5d8da">npm</tspan>
  </text>
  <rect class="cursor" x="607.8" y="79" width="20" height="64" rx="2" fill="#e95678" opacity="0.9"/>

  <text x="500" y="192" font-size="21" font-weight="600" fill="#d5d8da" text-anchor="middle">Better (p)npm.</text>
  <text x="500" y="220" font-size="14.5" fill="#9a9ca8" text-anchor="middle">The same npm or pnpm, with an interactive layer on top.</text>
  <text x="500" y="243" font-size="14.5" fill="#6c6f93" text-anchor="middle">Missing arguments turn into prompts. Nothing else changes.</text>
</svg>
