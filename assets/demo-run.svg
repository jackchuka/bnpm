      <text x="146" y="118" fill="#9a9ca8" textLength="151.2" lengthAdjust="spacingAndGlyphs">my-app · 8 scripts</text>
      <text x="20" y="142" fill="#6c6f93" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
      <text x="45.2" y="142" fill="#9a9ca8" textLength="58.8" lengthAdjust="spacingAndGlyphs">Search:</text>
      <g clip-path="url(#tc2)"><text x="112.4" y="142" fill="#d5d8da" textLength="16.8" lengthAdjust="spacingAndGlyphs">te</text></g>
    </g>
    <g class="t2">
      <rect class="c2" x="112.4" y="128" width="8.4" height="19" rx="1" fill="#e95678"/>
    </g>
    <g class="fl"><text x="154.4" y="142" fill="#6c6f93" textLength="75.6" lengthAdjust="spacingAndGlyphs">(1 match)</text></g>

    <g class="uf">
      <text x="20" y="170" fill="#6c6f93" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
      <text x="45.2" y="170" fill="#e95678" textLength="8.4" lengthAdjust="spacingAndGlyphs">●</text>
      <text x="62" y="170" fill="#e95678" textLength="42.0" lengthAdjust="spacingAndGlyphs" font-weight="600">build</text>
      <text x="162.8" y="170" fill="#6c6f93" textLength="84.0" lengthAdjust="spacingAndGlyphs">vite build</text>
      <text x="20" y="192" fill="#6c6f93" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
      <text x="45.2" y="192" fill="#6c6f93" textLength="8.4" lengthAdjust="spacingAndGlyphs">○</text>
      <text x="62" y="192" fill="#9a9ca8" textLength="25.2" lengthAdjust="spacingAndGlyphs">dev</text>
      <text x="162.8" y="192" fill="#6c6f93" textLength="67.2" lengthAdjust="spacingAndGlyphs">vite dev</text>
      <text x="20" y="214" fill="#6c6f93" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
      <text x="45.2" y="214" fill="#6c6f93" textLength="8.4" lengthAdjust="spacingAndGlyphs">○</text>
      <text x="62" y="214" fill="#9a9ca8" textLength="33.6" lengthAdjust="spacingAndGlyphs">lint</text>
      <text x="162.8" y="214" fill="#6c6f93" textLength="67.2" lengthAdjust="spacingAndGlyphs">eslint .</text>
      <text x="20" y="236" fill="#6c6f93" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
      <text x="45.2" y="236" fill="#6c6f93" textLength="8.4" lengthAdjust="spacingAndGlyphs">○</text>
      <text x="62" y="236" fill="#9a9ca8" textLength="50.4" lengthAdjust="spacingAndGlyphs">format</text>
      <text x="162.8" y="236" fill="#6c6f93" textLength="151.2" lengthAdjust="spacingAndGlyphs">prettier --write .</text>
      <text x="20" y="258" fill="#6c6f93" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
      <text x="45.2" y="258" fill="#6c6f93" textLength="8.4" lengthAdjust="spacingAndGlyphs">○</text>
      <text x="62" y="258" fill="#9a9ca8" textLength="42.0" lengthAdjust="spacingAndGlyphs">start</text>
      <text x="162.8" y="258" fill="#6c6f93" textLength="117.6" lengthAdjust="spacingAndGlyphs">node server.js</text>
      <text x="20" y="282" fill="#6c6f93" textLength="8.4" lengthAdjust="spacingAndGlyphs">└</text>
    </g>

    <g class="fl">
      <text x="20" y="170" fill="#6c6f93" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
      <text x="45.2" y="170" fill="#e95678" textLength="8.4" lengthAdjust="spacingAndGlyphs">●</text>
      <text x="62" y="170" fill="#e95678" textLength="33.6" lengthAdjust="spacingAndGlyphs" font-weight="600">test</text>
      <text x="162.8" y="170" fill="#6c6f93" textLength="84.0" lengthAdjust="spacingAndGlyphs">vitest run</text>
      <text x="20" y="194" fill="#6c6f93" textLength="8.4" lengthAdjust="spacingAndGlyphs">└</text>
    </g>

    <g class="rs">
      <text x="20" y="230" fill="#29d398" textLength="8.4" lengthAdjust="spacingAndGlyphs">◇</text>
      <text x="45.2" y="230" fill="#d5d8da" textLength="117.6" lengthAdjust="spacingAndGlyphs">$ npm run test</text>
    </g>
  </g>
</svg>
